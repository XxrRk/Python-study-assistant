name: Validate Python Study Assistant skills

on:
  push:
    paths:
      - "Skills/**"
      - "tests/**"
      - "tools/**"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_CHECKLIST.md"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Skills/**"
      - "tests/**"
      - "tools/**"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_CHECKLIST.md"
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: Run official quick_validate.py (v0.2–v0.8)
        run: |
          python tests/tools/quick_validate.py Skills/python-study-assistant-v0-2
          python tests/tools/quick_validate.py Skills/python-study-assistant-v0-3
          python tests/tools/quick_validate.py Skills/python-study-assistant-v0-4
          python tests/tools/quick_validate.py Skills/python-study-assistant-v0-5
          python tests/tools/quick_validate.py Skills/python-study-assistant-v0-6
          python tests/tools/quick_validate.py Skills/python-study-assistant-v0-7
          python tests/tools/quick_validate.py Skills/python-study-assistant-v0-8

      - name: Check schemas, fixtures, quality cases, library map and versions
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          import yaml
          from jsonschema import Draft202012Validator

          root = Path(".")

          # --- Skill files exist ---
          for version in ("v0-2", "v0-3", "v0-4", "v0-5", "v0-6", "v0-7", "v0-8"):
              skill = root / "Skills" / f"python-study-assistant-{version}"
              assert (skill / "SKILL.md").is_file(), f"{skill} SKILL.md missing"
              assert (skill / "agents" / "openai.yaml").is_file(), f"{skill} openai.yaml missing"

          # --- JSON Schemas ---
          cards_schema = json.loads((root / "tests" / "schema" / "cards.schema.json").read_text(encoding="utf-8"))
          deck_v03_schema = json.loads((root / "tests" / "schema" / "deck.schema.json").read_text(encoding="utf-8"))
          deck_v04_schema = json.loads((root / "tests" / "schema" / "deck-0.4.schema.json").read_text(encoding="utf-8"))
          quality_schema = json.loads((root / "tests" / "quality" / "cases.schema.json").read_text(encoding="utf-8"))
          for schema in (cards_schema, deck_v03_schema, deck_v04_schema, quality_schema):
              Draft202012Validator.check_schema(schema)

          v03_deck_validator = Draft202012Validator(deck_v03_schema)
          v04_deck_validator = Draft202012Validator(deck_v04_schema)

          # v0.3 Deck
          v03_deck = json.loads((root / "tests" / "fixtures" / "v0.3" / "deck-existing.json").read_text(encoding="utf-8"))
          assert not list(v03_deck_validator.iter_errors(v03_deck)), "v0.3 deck invalid"
          v03_invalid = json.loads((root / "tests" / "fixtures" / "v0.3" / "deck-invalid.json").read_text(encoding="utf-8"))
          assert list(v03_deck_validator.iter_errors(v03_invalid)), "v0.3 invalid deck accepted"

          # v0.4 Decks
          for name in ("deck-existing.json", "deck-other.json", "filter-deck.json"):
              data = json.loads((root / "tests" / "fixtures" / "v0.4" / name).read_text(encoding="utf-8"))
              errors = sorted(v04_deck_validator.iter_errors(data), key=str)
              assert not errors, [f"{name}: {error.message}" for error in errors]
          v04_invalid = json.loads((root / "tests" / "fixtures" / "v0.4" / "deck-invalid.json").read_text(encoding="utf-8"))
          assert list(v04_deck_validator.iter_errors(v04_invalid)), "v0.4 invalid deck accepted"
          v03_fixture = json.loads((root / "tests" / "fixtures" / "v0.4" / "deck-v03.json").read_text(encoding="utf-8"))
          assert not list(v03_deck_validator.iter_errors(v03_fixture)), "migration source invalid"

          # --- v0.2 fixtures ---
          v02_expected = {
              "01_alias_libraries.py", "02_duplicate_imports.py", "03_prose_mentions.md",
              "04_local_modules.py", "05_secrets.py", "06_side_effects.py", "07_dedupe_padding.md",
              "08_non_python.md",
          }
          v02_names = {path.name for path in (root / "tests" / "fixtures").glob("*") if path.is_file()}
          assert not v02_expected - v02_names, f"missing v0.2 fixtures: {sorted(v02_expected - v02_names)}"

          # --- v0.3 fixtures ---
          v03_dir = root / "tests" / "fixtures" / "v0.3"
          v03_expected = {
              "notebook_demo.ipynb", "article_noise.html", "aliases_v03.py", "unknown_imports.py",
              "batch/a.md", "batch/b.py", "batch/nested/c.txt", "deck-existing.json",
              "deck-invalid.json", "merge-material.md",
          }
          v03_names = {path.relative_to(v03_dir).as_posix() for path in v03_dir.rglob("*") if path.is_file()}
          assert not v03_expected - v03_names, f"missing v0.3 fixtures: {sorted(v03_expected - v03_names)}"

          # --- v0.4 fixtures ---
          v04_dir = root / "tests" / "fixtures" / "v0.4"
          v04_expected = {
              "deck-existing.json", "deck-other.json", "deck-invalid.json", "deck-v03.json",
              "filter-deck.json", "merge-material.md", "pii_and_secrets.md",
          }
          v04_names = {path.relative_to(v04_dir).as_posix() for path in v04_dir.rglob("*") if path.is_file()}
          assert not v04_expected - v04_names, f"missing v0.4 fixtures: {sorted(v04_expected - v04_names)}"

          # --- v0.6 fixtures ---
          v06_dir = root / "tests" / "fixtures" / "v0.6"
          v06_expected = {
              "article.rst", "article.docx", "large_material.md",
              "batch/a.rst", "batch/c.docx", "batch/nested/b.md",
          }
          v06_names = {path.relative_to(v06_dir).as_posix() for path in v06_dir.rglob("*") if path.is_file()}
          assert not v06_expected - v06_names, f"missing v0.6 fixtures: {sorted(v06_expected - v06_names)}"

          # --- v0.7 fixtures ---
          v07_dir = root / "tests" / "fixtures" / "v0.7"
          v07_expected = {"english_material.md", "anki-profile.yaml"}
          v07_names = {path.relative_to(v07_dir).as_posix() for path in v07_dir.rglob("*") if path.is_file()}
          assert not v07_expected - v07_names, f"missing v0.7 fixtures: {sorted(v07_expected - v07_names)}"

          # --- v0.8 fixtures ---
          v08_dir = root / "tests" / "fixtures" / "v0.8"
          v08_expected = {"review-profile.yaml"}
          v08_names = {path.relative_to(v08_dir).as_posix() for path in v08_dir.rglob("*") if path.is_file()}
          assert not v08_expected - v08_names, f"missing v0.8 fixtures: {sorted(v08_expected - v08_names)}"

          # --- quality cases ---
          quality = json.loads((root / "tests" / "quality" / "cases.json").read_text(encoding="utf-8"))
          quality_errors = sorted(Draft202012Validator(quality_schema).iter_errors(quality), key=str)
          assert not quality_errors, [error.message for error in quality_errors]
          case_ids = [case["id"] for case in quality["cases"]]
          assert len(case_ids) == len(set(case_ids)), "quality case ids must be unique"
          assert len(case_ids) >= 20, "quality cases too few"
          for case in quality["cases"]:
              fixture = root / case["fixture"]
              assert fixture.is_file(), f"quality fixture missing: {case['fixture']}"
              if "secondary_fixture" in case:
                  assert (root / case["secondary_fixture"]).is_file(), f"secondary fixture missing: {case['secondary_fixture']}"
              expectations = case["expectations"]
              assert expectations["min_cards"] <= expectations["max_cards"], f"bad card range: {case['id']}"

          # --- v0.5 library map ---
          library_map = yaml.safe_load(
              (root / "Skills" / "python-study-assistant-v0-8" / "references" / "library-map.yaml").read_text(encoding="utf-8")
          )
          assert library_map.get("schema_version") == "1.0", "library-map schema_version"
          mappings = library_map.get("mappings")
          assert isinstance(mappings, list) and mappings, "library-map mappings missing"
          import_names = []
          for item in mappings:
              for key in ("import_name", "package", "kind", "notes"):
                  assert key in item and str(item[key]).strip(), f"library-map missing {key}"
              assert item["kind"] in ("stdlib", "third-party"), f"bad kind: {item['kind']}"
              import_names.append(item["import_name"])
          assert len(import_names) == len(set(import_names)), "duplicate library import_name"
          expected_aliases = {
              "PIL", "yaml", "bs4", "sklearn", "cv2", "dateutil", "dotenv", "jwt", "Crypto",
              "serial", "OpenGL", "skimage", "docx", "pptx", "grpc", "pydirectinput",
          }
          assert expected_aliases <= set(import_names), f"missing aliases: {sorted(expected_aliases - set(import_names))}"
          assert (root / "Skills" / "python-study-assistant-v0-8" / "references" / "library-map.md").is_file()

          # --- Release tooling ---
          release_check = root / "tools" / "release_check.py"
          assert release_check.is_file(), "tools/release_check.py missing"
          compile(release_check.read_text(encoding="utf-8"), str(release_check), "exec")
          assert (root / ".github" / "workflows" / "release.yml").is_file(), "release workflow missing"
          release_workflow = (root / ".github" / "workflows" / "release.yml").read_text(encoding="utf-8")
          for marker in ("workflow_dispatch", "environment: release", "permissions:", "contents: write", "gh release create"):
              assert marker in release_workflow, f"release workflow missing {marker}"

          # --- v0.8 SKILL sections and references ---
          text = (root / "Skills" / "python-study-assistant-v0-8" / "SKILL.md").read_text(encoding="utf-8")
          required_sections = [
              "Deck 操作", "写回前必须 diff", "筛选导出", "跨 Deck 合并",
              "质量基线", "质量用例", "安全预扫描", "长材料与覆盖报告",
              "输出语言与术语", "Anki 导出 profile", "Markdown 复习库",
              "references/output-language.md", "references/export-profiles.md",
              "references/markdown-vaults.md", "references/library-map.yaml",
              "references/large-materials.md", "RST", "DOCX", "schema_version",
          ]
          for section in required_sections:
              assert section in text, f"v0.8 SKILL.md missing: {section}"
          for reference in (
              "deck-format.md", "deck-operations.md", "exports.md", "input-formats.md",
              "library-map.md", "library-map.yaml", "quality-eval.md", "security.md",
              "large-materials.md", "output-language.md", "export-profiles.md", "markdown-vaults.md",
          ):
              assert (root / "Skills" / "python-study-assistant-v0-8" / "references" / reference).is_file(), reference

          # --- Version consistency ---
          frontmatter = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
          assert frontmatter, "v0.8 SKILL.md frontmatter missing"
          meta = yaml.safe_load(frontmatter.group(1))
          assert str(meta.get("metadata", {}).get("version")) == "0.8.0", meta.get("metadata")
          readme = (root / "README.md").read_text(encoding="utf-8")
          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          checklist = (root / "RELEASE_CHECKLIST.md").read_text(encoding="utf-8")
          openai = yaml.safe_load((root / "Skills" / "python-study-assistant-v0-8" / "agents" / "openai.yaml").read_text(encoding="utf-8"))
          assert "v0.8.0" in readme, "README missing v0.8.0"
          assert "## [0.8.0]" in changelog, "CHANGELOG missing [0.8.0]"
          assert "0.8.0" in checklist, "RELEASE_CHECKLIST missing 0.8.0"
          assert "v0.8" in openai["interface"]["display_name"], "openai.yaml display_name missing v0.8"

          # --- Fixture security policy ---
          forbidden = [
              "ghp_", "sk-", "-----BEGIN RSA PRIVATE KEY-----",
              "xyp080803@163.com", "C:\\Users\\",
          ]
          for path in (root / "tests" / "fixtures").rglob("*"):
              if not path.is_file():
                  continue
              try:
                  fixture_text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in forbidden:
                  assert token not in fixture_text, f"forbidden fixture content {token!r} in {path}"

          print("v0.2 fixtures:", sorted(v02_names))
          print("v0.3 fixtures:", sorted(v03_names))
          print("v0.4 fixtures:", sorted(v04_names))
          print("v0.6 fixtures:", sorted(v06_names))
          print("v0.7 fixtures:", sorted(v07_names))
          print("v0.8 fixtures:", sorted(v08_names))
          print("quality cases:", len(case_ids))
          print("library mappings:", len(mappings))
          print("schemas: valid")
          print("v0.3 and v0.4 decks: valid")
          print("release tooling: present")
          print("version markers: consistent")
          print("fixture security policy: ok")
          PY
