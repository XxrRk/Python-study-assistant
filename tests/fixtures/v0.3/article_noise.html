    <h2>Path 对象</h2>
    <p>pathlib 用 <code>Path</code> 对象表示文件路径，比直接拼接字符串更清晰。</p>
    <p><code>Path("data") / "file.txt"</code> 可以拼接路径。</p>
    <pre><code class="language-python">from pathlib import Path

p = Path("data") / "file.txt"
print(p)
</code></pre>
    <p><code>Path("data/file.txt").parent</code> 返回父目录。</p>
